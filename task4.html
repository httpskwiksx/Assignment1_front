    <h1 id="grades-title">Student Grades</h1>
<table id="grades-table">
    <thead>
        <tr>
            <th>Student Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Yoko Ono</td>
            <td>Mathematics</td>
            <td>A-</td>
        </tr>
        <tr class="highlight-row">
            <td>John Smith</td>
            <td>Web Technologies</td>
            <td>B+</td>
        </tr>
        <tr>
            <td>Michael Johnson</td>
            <td>Kazakh Language</td>
            <td>C</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="2">Total Students</td>
            <td>3</td>
        </tr>
    </tfoot>
</table>

    <h2 id="feedback-title">Feedback Form</h2>
    <form class="feedback-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="role">Your Role:</label>
        <select id="role" name="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="parent">Parent</option>
            <option value="other">Other</option>
        </select>
        <fieldset>
            <legend>Was this website useful?</legend>
            <input type="radio" id="useful-yes" name="useful" value="yes">
            <label for="useful-yes">Yes</label>
            <input type="radio" id="useful-no" name="useful" value="no">
            <label for="useful-no">No</label>
        </fieldset>
        <label for="comments">Additional Comments:</label>
        <textarea id="comments" name="comments" rows="5" placeholder="Please share your feedback..."></textarea>      
        <button type="submit" class="btn">Send Feedback</button>
    </form>
    <div class="footer">

    </div>
</body>
</html>
